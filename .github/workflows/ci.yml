name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - name: Install pnpm
        run: npm install -g pnpm
      # Build the mobile PWA so rust-embed (app/src-tauri/src/server/spa.rs
      # embeds mobile/dist) compiles against the real SPA. Without this the
      # CI binary embeds an empty dist — diverging from the shipped binary
      # and masking LAN/mobile/QR pairing breakage. cargo test exercises the
      # actual embed.
      - name: Build mobile PWA (rust-embed source)
        working-directory: mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Cargo test
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Cargo clippy
        working-directory: app/src-tauri
        run: cargo clippy -- -D warnings

  typescript:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install & type-check (desktop)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc -b --noEmit
      - name: Test (desktop, vitest)
        working-directory: app
        run: pnpm test
      - name: Lint (desktop, eslint)
        working-directory: app
        run: pnpm lint
      - name: Install & type-check (mobile)
        working-directory: mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit
      - name: Lint (mobile, eslint)
        working-directory: mobile
        run: pnpm lint
